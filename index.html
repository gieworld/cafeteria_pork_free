<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIT Pork-Free Menu</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-pattern: repeating-linear-gradient(45deg, #e5e5e5 25%, transparent 25%, transparent 75%, #e5e5e5 75%, #e5e5e5), repeating-linear-gradient(45deg, #e5e5e5 25%, #ffffff 25%, #ffffff 75%, #e5e5e5 75%, #e5e5e5);
        }

        body {
            background-color: #ffffff;
            background-image: radial-gradient(#aaa 15%, transparent 16%), radial-gradient(#aaa 15%, transparent 16%);
            background-size: 4px 4px;
            background-position: 0 0, 2px 2px;
            color: #000;
            font-family: 'VT323', monospace;
        }

        /* Chicago-style Window */
        .mac-window {
            background: #fff;
            border: 2px solid #000;
            box-shadow: 4px 4px 0px #000;
            margin-bottom: 24px;
        }

        /* Title Bar with Stripes */
        .title-bar {
            border-bottom: 2px solid #000;
            padding: 4px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: repeating-linear-gradient(180deg,
                    #000,
                    #000 1px,
                    #fff 1px,
                    #fff 2px);
        }

        .title-text {
            background: #fff;
            padding: 0 12px;
            font-size: 1.25rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Retro Tabs */
        .retro-tab {
            border: 2px solid #000;
            background: #fff;
            margin-right: -2px;
            /* Connect them */
            padding: 4px 12px;
            font-size: 1.1rem;
            cursor: pointer;
            position: relative;
        }

        .retro-tab:hover {
            background: #ddd;
        }

        .retro-tab.active {
            background: #000;
            color: #fff;
            z-index: 10;
        }

        /* Content Area */
        .content-area {
            padding: 16px;
        }

        .alert-box {
            border: 2px solid #000;
            padding: 12px;
            margin-bottom: 16px;
        }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            border: 1px solid #000;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .badge-safe {
            background-color: #fff;
            color: #000;
            border: 2px solid #000;
        }

        .badge-warn {
            background-color: #ddd;
            color: #000;
            border: 2px solid #000;
            border-style: dotted;
        }

        .badge-danger {
            background-color: #000;
            color: #fff;
            border: 2px solid #000;
        }

        .hidden {
            display: none;
        }

        /* The Korean original - this is the line you point at, at the counter.
           VT323 has no Hangul, so name the fallback stack instead of leaving it to chance. */
        .ko {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            font-size: 0.8rem;
            color: #444;
            letter-spacing: 0.02em;
        }

        /* Collapsed cafeteria: the title bar itself is the toggle */
        summary.title-bar {
            cursor: pointer;
            list-style: none;
        }

        summary.title-bar::-webkit-details-marker {
            display: none;
        }

        summary.title-bar::marker {
            content: '';
        }
    </style>
</head>

<body class="p-4 min-h-screen flex flex-col items-center justify-start">

    <!-- System 7 Window Frame -->
    <div class="mac-window w-full max-w-2xl relative bg-white">

        <!-- Title Bar -->
        <div class="title-bar">
            <span class="title-text">🍽️ KIT Pork-Free Guide</span>
        </div>

        <!-- App Header Info -->
        <div class="border-b-2 border-black p-3 bg-white flex justify-between items-center">
            <div class="text-lg">System: <span class="font-bold">KIT Cafeteria</span></div>
            <div id="update-time" class="text-sm border border-black px-2 py-1">Loading...</div>
        </div>

        <!-- Navigation (Tabs) -->
        <nav class="flex p-3 pb-0 border-b-2 border-black bg-gray-100 overflow-x-auto">
            <button onclick="switchTab('Monday')" id="tab-Monday" class="retro-tab">MON</button>
            <button onclick="switchTab('Tuesday')" id="tab-Tuesday" class="retro-tab">TUE</button>
            <button onclick="switchTab('Wednesday')" id="tab-Wednesday" class="retro-tab">WED</button>
            <button onclick="switchTab('Thursday')" id="tab-Thursday" class="retro-tab">THU</button>
            <button onclick="switchTab('Friday')" id="tab-Friday" class="retro-tab">FRI</button>
        </nav>

        <!-- The disclaimer belongs where it cannot be scrolled past -->
        <div class="border-b-2 border-black px-3 py-1 bg-black text-white text-center">
            ⚠ PORK-FREE GUIDE ONLY — NOT HALAL CERTIFIED
        </div>

        <!-- Main Content (White Canvas) -->
        <main id="content" class="content-area min-h-[400px]">
            <div id="loading" class="text-center py-20 text-xl animate-pulse">
                [ READING DISK... ]
            </div>
            <div id="error-msg" class="hidden text-center py-20 text-red-600 font-bold border-2 border-red-600 m-4 p-4">
                ⚠ SYSTEM ERROR: FAILED TO LOAD DATA.
            </div>
        </main>

        <!-- Footer -->
        <footer class="border-t-2 border-black p-2 text-center text-sm bg-gray-100">
            <p class="text-xs">KIT Pork-Free v2.0 (System 7 Edition)</p>
        </footer>
    </div>

    <script>
        let menuData = {};
        const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
        const today = new Date().toLocaleDateString('en-US', { weekday: 'long' });

        async function loadData() {
            try {
                // Determine base URL (GitHub Pages uses repository name)
                const response = await fetch('data/menu_data.json?v=' + new Date().getTime());
                if (!response.ok) throw new Error("No data file");

                const data = await response.json();
                menuData = data.week_data;

                // Label each tab with the real date from the site's own header, and find
                // which tab is actually today - the weekday name alone can't tell us
                // whether this file holds the current week or a stale one.
                const todayISO = new Date().toLocaleDateString('en-CA');
                let todayTab = null;
                days.forEach(d => {
                    const iso = menuData[d] && menuData[d].date;
                    if (!iso) return;
                    document.getElementById(`tab-${d}`).innerText =
                        `${d.slice(0, 3).toUpperCase()} ${iso.slice(5).replace('-', '/')}`;
                    if (iso === todayISO) todayTab = d;
                });

                const staleWeek = data.week_start && days.includes(today) && !todayTab;
                document.getElementById('update-time').innerText =
                    "Updated: " + new Date(data.updated_at).toLocaleDateString()
                    + (staleWeek ? " ⚠ not this week" : "");
                document.getElementById('loading').classList.add('hidden');

                // Open today's tab (by date), else today's weekday, else Monday
                const startDay = todayTab || (days.includes(today) ? today : "Monday");
                switchTab(startDay);

            } catch (e) {
                console.error(e);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error-msg').classList.remove('hidden');
            }
        }

        function switchTab(day) {
            // Update Tabs
            days.forEach(d => {
                const btn = document.getElementById(`tab-${d}`);
                if (d === day) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            renderMenu(day);
        }

        // A dish is {en, ko}; older data files stored a bare string.
        function dish(item) {
            if (item && typeof item === 'object') return { en: item.en || '', ko: item.ko || '' };
            return { en: String(item || ''), ko: '' };
        }

        // English to understand it, Korean to point at it on the counter sign.
        function dishLine(item, tag) {
            const d = dish(item);
            if (!d.en) return '';
            return `<${tag}>${d.en}${d.ko ? `<div class="ko">${d.ko}</div>` : ''}</${tag}>`;
        }

        // VT323 draws "~" high and thin, so "11:00~14:00" reads as "11:00*14:00".
        function fmtTime(s) {
            return String(s || '').replace(/~/g, '-');
        }

        // Every HH:MM~HH:MM window in a selling_time string, as minutes from midnight.
        function timeWindows(s) {
            return [...String(s || '').matchAll(/(\d{1,2}):(\d{2})\s*[~\-]\s*(\d{1,2}):(\d{2})/g)]
                .map(m => [+m[1] * 60 + +m[2], +m[3] * 60 + +m[4]]);
        }

        function openNow(sellingTime, mins) {
            return timeWindows(sellingTime).some(([from, to]) => mins >= from && mins <= to);
        }

        // Run selfCheck() in devtools after touching the time/dish helpers above.
        function selfCheck() {
            const eq = (got, want, what) => {
                if (JSON.stringify(got) !== JSON.stringify(want))
                    throw new Error(`${what}: got ${JSON.stringify(got)}, want ${JSON.stringify(want)}`);
            };
            eq(timeWindows('11:40~13:30 (also 11:00~11:40 at the A La Carte hall)'),
                [[700, 810], [660, 700]], 'both windows incl. the parenthetical one');
            eq(openNow('11:00~14:00 16:00~18:30', 12 * 60), true, 'open at 12:00');
            eq(openNow('11:00~14:00 16:00~18:30', 15 * 60), false, 'closed at 15:00');
            eq(openNow('11:00~14:00 16:00~18:30', 17 * 60), true, 'open at 17:00');
            eq(fmtTime('11:00~14:00'), '11:00-14:00', 'tilde becomes hyphen');
            eq(dish({ en: 'Udon', ko: '우동' }), { en: 'Udon', ko: '우동' }, 'object dish');
            eq(dish('Legacy String'), { en: 'Legacy String', ko: '' }, 'legacy string dish');
            return 'index.html self-check OK';
        }

        // The one thing a student standing in the hall actually wants: what is
        // servable right now. Derived from selling_time vs the clock - no new data.
        function nowBox(dayData) {
            const now = new Date();
            if (dayData.date !== now.toLocaleDateString('en-CA')) return ''; // only for today
            const mins = now.getHours() * 60 + now.getMinutes();

            const lines = [];
            (dayData.cafeterias || []).forEach(cafe => {
                if (cafe.type === 'package') {
                    (cafe.meals || []).forEach(meal => {
                        if (!openNow(meal.selling_time, mins)) return;
                        const ok = meal.verdict === 'SAFE' || meal.verdict === 'WORTH IT';
                        lines.push(`<b>${cafe.name}</b> — ` + (ok
                            ? dish({ en: meal.main_dish, ko: meal.main_dish_ko }).en
                            : 'contains pork, skip'));
                    });
                    return;
                }
                const bkf = cafe.breakfast;
                if (bkf && bkf.verdict !== 'NONE' && openNow(bkf.selling_time, mins)) {
                    lines.push(`<b>${cafe.name} breakfast</b> — ` +
                        (bkf.verdict === 'SAFE' ? bkf.main_dish : 'contains pork, skip'));
                }
                if (openNow(cafe.selling_time, mins)) {
                    const safe = (cafe.safe_options || []).map(dish).filter(d => d.en);
                    lines.push(`<b>${cafe.name}</b> — ` +
                        (safe.length ? safe.map(d => d.en).join(', ') : 'nothing pork-free'));
                }
            });

            if (!lines.length) {
                return `<div class="alert-box mb-4 text-center">NOTHING SERVING RIGHT NOW</div>`;
            }
            return `<div class="alert-box mb-4">
                <div class="font-bold mb-1">▶ SERVING NOW</div>
                ${lines.map(l => `<div class="text-sm">${l}</div>`).join('')}
            </div>`;
        }

        function renderMenu(day) {
            const container = document.getElementById('content');
            container.innerHTML = ""; // Clear existing

            const dayData = menuData[day];

            if (!dayData) {
                container.innerHTML = `<div class="text-center py-10 text-gray-500">No data available for ${day}</div>`;
                return;
            }

            container.innerHTML = nowBox(dayData);

            dayData.cafeterias.forEach(cafe => {
                const card = document.createElement('div');
                card.className = 'mac-window mb-6'; // Inner windows

                let hasContent = false;
                let html = '';

                if (cafe.note && !cafe.fixed_menu) {
                    html += `<div class="mb-3 text-center border-2 border-dotted border-black py-1">${cafe.note}</div>`;
                    hasContent = true;
                }

                if (cafe.type === 'individual') {
                    // A La Carte — show breakfast block first if present
                    if (cafe.breakfast && cafe.breakfast.verdict !== 'NONE') {
                        const bkf = cafe.breakfast;
                        let bBadgeClass = bkf.verdict === 'SAFE' ? 'badge-safe' : 'badge-danger';
                        let bBadgeText = bkf.verdict === 'SAFE' ? 'SAFE' : 'PORK !!';
                        html += `
                        <div class="mb-4 border-b-2 border-dashed border-black pb-4">
                            <div class="flex justify-between items-start mb-1">
                                <span class="font-bold uppercase bg-black text-white px-2 py-0.5">BREAKFAST</span>
                                <span class="badge ${bBadgeClass}">${bBadgeText}</span>
                            </div>
                            <div class="text-xs mb-2 font-mono text-gray-700">
                                ${bkf.price ? `<span class="mr-2">💰 ${bkf.price}</span>` : ''}
                                ${bkf.selling_time ? `<span>🕒 ${fmtTime(bkf.selling_time)}</span>` : ''}
                            </div>
                            <div class="text-xl mb-1">${bkf.main_dish || 'N/A'}</div>
                            ${bkf.main_dish_ko ? `<div class="ko mb-1">${bkf.main_dish_ko}</div>` : ''}
                            ${bkf.reason ? `<div class="text-sm text-gray-600">${bkf.reason}</div>` : ''}
                        </div>`;
                        hasContent = true;
                    }

                    // Display Price/Time Header for lunch/dinner if available
                    if (cafe.price || cafe.selling_time) {
                        html += `
                        <div class="mb-4 p-2 bg-gray-100 border border-black text-sm text-center">
                            ${cafe.price ? `<span class="mr-3">💰 ${cafe.price}</span>` : ''}
                            ${cafe.selling_time ? `<span>🕒 ${fmtTime(cafe.selling_time)}</span>` : ''}
                        </div>`;
                    }

                    if (cafe.safe_options && cafe.safe_options.length > 0) {
                        html += `<div class="mb-3"><span class="badge badge-safe">SAFE OPTIONS</span></div>`;
                        html += `<ul class="list-square ml-5 space-y-2 mb-4">`;
                        cafe.safe_options.forEach(item => {
                            html += dishLine(item, 'li');
                        });
                        html += `</ul>`;
                        hasContent = true;
                    }
                    if (cafe.avoid && cafe.avoid.length > 0) {
                        html += `<div class="mb-3"><span class="badge badge-danger">CONTAINS PORK</span></div>`;
                        html += `<ul class="list-square ml-5 space-y-2">`;
                        cafe.avoid.forEach(item => {
                            html += dishLine(item, 'li');
                        });
                        html += `</ul>`;
                        hasContent = true;
                    }
                } else {
                    // Package Meals
                    cafe.meals.forEach(meal => {
                        let badgeClass = 'badge-danger';
                        let badgeText = 'PORK !!';

                        if (meal.verdict === 'SAFE') {
                            badgeClass = 'badge-safe';
                            badgeText = 'SAFE';
                        } else if (meal.verdict === 'WORTH IT') {
                            badgeClass = 'badge-warn';
                            badgeText = 'MAYBE';
                        } else if (meal.verdict === 'NONE') {
                            return; // Skip empty meals
                        }

                        hasContent = true;
                        html += `
                        <div class="mb-6 border-b-2 border-dashed border-black pb-4 last:border-0 last:pb-0">
                            <div class="flex justify-between items-start mb-1">
                                <span class="font-bold uppercase bg-black text-white px-2 py-0.5">${meal.time}</span>
                                <span class="badge ${badgeClass}">${badgeText}</span>
                            </div>
                            
                            <!-- Price & Time Info -->
                            ${(meal.price || meal.selling_time) ?
                                `<div class="text-xs mb-2 font-mono text-gray-700">
                                    ${meal.price ? `<span class="mr-2">💰 ${meal.price}</span>` : ''}
                                    ${meal.selling_time ? `<span>🕒 ${fmtTime(meal.selling_time)}</span>` : ''}
                                 </div>` : ''}

                            <div class="text-xl mb-1">${meal.main_dish || 'No info'}</div>
                            ${meal.main_dish_ko ? `<div class="ko mb-2">${meal.main_dish_ko}</div>` : ''}

                            ${meal.safe_items && meal.safe_items.length ?
                                `<div class="text-sm mt-1">👍 ${meal.safe_items.join(', ')}</div>` : ''}
                            
                            ${meal.skip_items && meal.skip_items.length ?
                                `<div class="text-sm mt-1 font-bold">🛑 SKIP: ${meal.skip_items.join(', ')}</div>` : ''}
                        </div>`;
                    });
                }

                if (!hasContent) {
                    html += `<div class="text-center py-4 border-2 border-dotted border-gray-400">[ NO DATA ]</div>`;
                }

                // A fixed-menu counter (Snack Bar) prints the same four items every
                // weekday, so it gets a collapsed row instead of a full window - the
                // cafeterias whose menu actually rotates stay on top.
                const safeCount = (cafe.safe_options || []).map(dish).filter(d => d.en).length;
                const label = cafe.fixed_menu
                    ? `${cafe.name} — ${cafe.note || `${safeCount} pork-free`}`
                    : cafe.name;
                const titleBar = tag => `
                <${tag} class="title-bar" style="height: 24px; padding: 2px;">
                    <span class="title-text" style="font-size: 1rem; padding: 0 8px;">${label}</span>
                </${tag}>`;

                card.innerHTML = cafe.fixed_menu
                    ? `<details>${titleBar('summary')}<div class="p-4">${html}</div></details>`
                    : `${titleBar('div')}<div class="p-4">${html}</div>`;
                container.appendChild(card);
            });
        }

        // Start
        loadData();
    </script>
</body>

</html>
